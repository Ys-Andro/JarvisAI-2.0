name: ManualJump 3GX Build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/manualjump-build.yml
      - source-archive/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manualjump-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 3GX for Azahar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build pinned 3gxtool 1.3 (Azahar-compatible 3GX v2)
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake g++ make python3 tar xz-utils
          python3 - <<'PY'
          import hashlib
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          dependencies = [
              (
                  "converter",
                  "https://gitlab.com/api/v4/projects/thepixellizeross%2F3gxtool/repository/archive.tar.gz?sha=57e3160ab72d8533a2f0601efdc8a149b4825ea5",
                  "ebfff29af3bfa2863ecce7968d3f03df8096ef81e6b89b93efd672bf8bd887da",
                  Path("/tmp/3gxtool.tar.gz"),
              ),
              (
                  "yaml-cpp",
                  "https://codeload.github.com/jbeder/yaml-cpp/tar.gz/refs/tags/0.8.0",
                  "fbe74bbdcee21d656715688706da3c8becfd946d92cd44705cc6098bb23b3a16",
                  Path("/tmp/yaml-cpp.tar.gz"),
              ),
              (
                  "dynalo",
                  "https://codeload.github.com/maddouri/dynalo/tar.gz/411199d712003195966b380bb4f5dcd2d63f4733",
                  "648267567395e4c88e0b12642c705c1f6d0ef0be851b165ffd8d3b7e7ffd6baf",
                  Path("/tmp/dynalo.tar.gz"),
              ),
          ]

          def fetch_with_retry(name, url):
              for attempt in range(7):
                  request = urllib.request.Request(
                      url, headers={"User-Agent": "ManualJump-CI/1.0"}
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=90) as response:
                          data = response.read(32 * 1024 * 1024 + 1)
                      if len(data) > 32 * 1024 * 1024:
                          raise SystemExit(f"{name}: archive exceeded size limit")
                      return data
                  except urllib.error.HTTPError as error:
                      if error.code not in (429, 500, 502, 503, 504) or attempt == 6:
                          raise
                      retry_after = error.headers.get("Retry-After")
                      delay = float(retry_after) if retry_after else min(120, 10 * (2 ** attempt))
                      print(f"{name}: HTTP {error.code}; retrying in {delay:g}s", flush=True)
                      time.sleep(delay)
                  except (urllib.error.URLError, TimeoutError, ConnectionError) as error:
                      if attempt == 6:
                          raise
                      delay = min(120, 10 * (2 ** attempt))
                      print(f"{name}: network error {error}; retrying in {delay:g}s", flush=True)
                      time.sleep(delay)
              raise SystemExit(f"{name}: download retries exhausted")

          for name, url, expected, destination in dependencies:
              data = fetch_with_retry(name, url)
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected:
                  raise SystemExit(f"{name}: SHA-256 mismatch: {actual}")
              destination.write_bytes(data)
              print(f"{name}: SHA-256 verified ({actual})")
          PY

          mkdir -p /tmp/3gxtool /tmp/yaml-cpp /tmp/dynalo
          tar -xzf /tmp/3gxtool.tar.gz --strip-components=1 -C /tmp/3gxtool
          tar -xzf /tmp/yaml-cpp.tar.gz --strip-components=1 -C /tmp/yaml-cpp
          tar -xzf /tmp/dynalo.tar.gz --strip-components=1 -C /tmp/dynalo

          cmake -S /tmp/yaml-cpp -B /tmp/yaml-build \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DYAML_CPP_BUILD_TESTS=OFF -DYAML_CPP_BUILD_TOOLS=OFF \
            -DCMAKE_CXX_FLAGS='-include cstdint' -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/yaml-build --parallel 2

          g++ -std=c++17 -include cstdint -static-libstdc++ -static-libgcc \
            -I/tmp/3gxtool/includes \
            -I/tmp/yaml-cpp/include \
            -I/tmp/yaml-cpp/include/yaml-cpp \
            -I/tmp/dynalo/include/dynalo \
            /tmp/3gxtool/sources/*.cpp \
            /tmp/yaml-build/libyaml-cpp.a -ldl \
            -o /tmp/3gxtool/3gxtool

          install -D -m 755 /tmp/3gxtool/3gxtool /opt/devkitpro/tools/bin/3gxtool
          command -v 3gxtool

      - name: Reassemble and extract project source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/source"
          cat source-archive/part_*.b64 | base64 -d > /tmp/ManualJump_Source_v0.1.tar.xz
          echo "6f1505bf1b194d25697166105238566428991c2addb18114506d541b6a6a5387  /tmp/ManualJump_Source_v0.1.tar.xz" | sha256sum -c -
          xz -t /tmp/ManualJump_Source_v0.1.tar.xz
          tar -xJf /tmp/ManualJump_Source_v0.1.tar.xz -C "$GITHUB_WORKSPACE/source"
          test -f "$GITHUB_WORKSPACE/source/ManualJump_Addon_SingleScreen_USA_v0.1/Makefile"

      - name: Apply libctru API compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("source/ManualJump_Addon_SingleScreen_USA_v0.1/src/main.c")
          source = path.read_text()

          old_macro = "#define CUR_PROCESS_HANDLE  ((Handle)0xFFFF8001u)\n"
          guarded_macro = (
              "#ifndef CUR_PROCESS_HANDLE\n"
              "#define CUR_PROCESS_HANDLE  ((Handle)0xFFFF8001u)\n"
              "#endif\n"
          )
          if guarded_macro not in source:
              if old_macro not in source:
                  raise SystemExit("CUR_PROCESS_HANDLE definition changed; review the compatibility patch")
              source = source.replace(old_macro, guarded_macro, 1)

          old_call = "svcCreateThread(&g_worker_thread, PluginWorker, NULL,"
          new_call = "svcCreateThread(&g_worker_thread, PluginWorker, 0,"
          if new_call not in source:
              if old_call not in source:
                  raise SystemExit("svcCreateThread call changed; review the compatibility patch")
              source = source.replace(old_call, new_call, 1)

          empty_c = path.with_name("csvc.c")
          if empty_c.exists():
              expected = "/* Intentionally empty: svcControlProcess is provided by src/csvc.S. */"
              if empty_c.read_text().strip() != expected:
                  raise SystemExit("csvc.c is no longer the known empty placeholder; review before removing")
              empty_c.unlink()

          path.write_text(source)
          if new_call not in source:
              raise SystemExit("svcCreateThread argument was not corrected")
          print("Applied libctru API compatibility fixes.")
          PY

      - name: Run project checks
        working-directory: source/ManualJump_Addon_SingleScreen_USA_v0.1
        shell: bash
        run: bash ./run_checks.sh

      - name: Compile plugin
        working-directory: source/ManualJump_Addon_SingleScreen_USA_v0.1
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEVKITARM:-}"
          test -f "$DEVKITARM/3ds_rules"
          export PATH="$DEVKITARM/bin:/opt/devkitpro/tools/bin:$PATH"
          command -v arm-none-eabi-gcc
          command -v 3gxtool
          make
          test -s ManualJump.3gx

      - name: Verify 3GX container
        working-directory: source/ManualJump_Addon_SingleScreen_USA_v0.1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          plugin = Path("ManualJump.3gx")
          header = plugin.read_bytes()[:8]
          print(f"ManualJump.3gx header: {header!r}")
          if header != b"3GX$0002":
              raise SystemExit("Unexpected 3GX container header; refusing to publish")
          print(f"Plugin size: {plugin.stat().st_size} bytes")
          PY

      - name: Package for Azahar
        working-directory: source/ManualJump_Addon_SingleScreen_USA_v0.1
        shell: bash
        run: |
          set -euo pipefail
          destination="$GITHUB_WORKSPACE/dist/sdmc/luma/plugins/0004000000033500"
          mkdir -p "$destination"
          cp ManualJump.3gx ManualJump.cfg "$destination/"
          cat > "$GITHUB_WORKSPACE/dist/INSTALACION.txt" <<'EOF'
          ManualJump Add-on - Ocarina of Time 3D USA Rev 1

          Instala la carpeta sdmc dentro del directorio SDMC usado por Azahar.
          La ruta final debe ser:
          sdmc/luma/plugins/0004000000033500/ManualJump.3gx
          sdmc/luma/plugins/0004000000033500/ManualJump.cfg

          Conserva SingleScreen 3.2.2 USA y su code.ips sin cambios.
          Activa "Enable 3GX plugin loader" en los ajustes del sistema de Azahar.
          El modo predeterminado es off. Cambia mode=off por mode=zr o mode=x
          solo para pruebas controladas y reinicia el juego tras cambiar el archivo.

          Este paquete solo certifica compilación y estructura 3GX. No certifica
          compatibilidad en ejecución ni el funcionamiento del salto en Azahar.
          Haz una copia de seguridad de tu partida antes de probar modos activos.
          EOF
          (cd "$GITHUB_WORKSPACE/dist" && zip -qr ManualJump_Azahar_USA_Install.zip sdmc INSTALACION.txt)
          test -s "$GITHUB_WORKSPACE/dist/ManualJump_Azahar_USA_Install.zip"

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ManualJump-3GX-Azahar-USA
          path: |
            source/ManualJump_Addon_SingleScreen_USA_v0.1/ManualJump.3gx
            dist/ManualJump_Azahar_USA_Install.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
